name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore XProj.sln

      - name: Build
        run: dotnet build XProj.sln --configuration Release --no-restore

      - name: Run smoke tests
        run: dotnet run --project ProjectManager.Wpf.SmokeTests/ProjectManager.Wpf.SmokeTests.csproj --configuration Release --no-build

      - name: Publish self-contained package
        run: >-
          dotnet publish ProjectManager.Wpf/ProjectManager.Wpf.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/self-contained

      - name: Publish framework-dependent package
        run: >-
          dotnet publish ProjectManager.Wpf/ProjectManager.Wpf.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/framework-dependent

      - name: Package release files
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path artifacts/self-contained/* -DestinationPath "artifacts/XProj-$version-win-x64-self-contained.zip"
          Compress-Archive -Path artifacts/framework-dependent/* -DestinationPath "artifacts/XProj-$version-win-x64-framework-dependent.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/XProj-${{ github.ref_name }}-win-x64-self-contained.zip
            artifacts/XProj-${{ github.ref_name }}-win-x64-framework-dependent.zip
